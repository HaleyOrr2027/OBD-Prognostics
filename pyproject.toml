[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="obd-prognostics"
version="0.2.0"
requires-python=">=3.10"
dependencies=["numpy>=1.26","pandas>=2.1","scikit-learn>=1.4","joblib>=1.3","PyYAML>=6.0"]

[project.optional-dependencies]
pi=["obd>=0.7.1","pyserial>=3.5"]
dev=["pytest>=8.0"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
