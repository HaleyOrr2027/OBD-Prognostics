name: Validate accelerator request across carOBD drives

on:
  pull_request:
    paths:
      - ".github/workflows/validate-pedal.yml"
      - "scripts/compare_pedal_sessions.py"
      - "scripts/fetch_carobd.py"
      - "training/02_label_modes.py"
      - "src/obd_anomaly/**"
      - "config/**"
      - "tests/unit/test_driver_intent.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-pedal-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install only the offline labeling/test dependencies; TensorFlow is not
      # needed for the driver-request detector and slows this validation job.
      - name: Install validation dependencies
        run: python -m pip install "pandas>=3.0.1" "numpy>=2.2.6" "scikit-learn>=1.9.1" pyyaml pytest matplotlib
      - name: Test driver-request rules
        run: python -m pytest tests/unit/test_driver_intent.py -v
      - name: Download original public carOBD recordings
        run: python scripts/fetch_carobd.py
      - name: Label both driving sessions
        run: python training/02_label_modes.py drive3 drive12
      - name: Compare pedal channels and detector outputs
        run: python scripts/compare_pedal_sessions.py drive3 drive12
      - name: Compare driver request with detected vehicle mode
        run: python scripts/plot_request_vs_mode.py drive3 drive12
      - name: Show report in job summary
        if: success()
        run: cat outputs/evaluation/pedal_session_comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pedal-session-comparison
          path: |
            outputs/evaluation/pedal_session_comparison.md
            outputs/evaluation/request_vs_mode_counts.csv
            outputs/evaluation/request_vs_mode_percent.csv
            outputs/evaluation/request_vs_mode_heatmap.png
          if-no-files-found: warn
          retention-days: 14
